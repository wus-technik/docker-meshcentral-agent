name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - v1
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write  # Required to push to GHCR

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lint entrypoint.sh
        run: shellcheck --shell=sh entrypoint.sh

      # Pull requests build to prove the Dockerfile still works, but publish
      # nothing — only pushes to a branch produce an image in the registry.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` and the date tag are reserved for the default branch, so a
      # build of any other branch publishes under that branch's own name.
      - name: Determine tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDD'}},enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
