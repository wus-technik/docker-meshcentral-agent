name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - v1
  pull_request:
  workflow_dispatch:  # Allows manual triggering

permissions:
  contents: read
  packages: write  # Required to push to GHCR

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lint entrypoint.sh
        run: shellcheck --shell=sh entrypoint.sh

      # Pull requests build to prove the Dockerfile still works, but publish
      # nothing — only pushes to a branch produce an image in the registry.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate date tag
        run: echo "DATE_TAG=$(date +'%Y%m%d')" >> "$GITHUB_ENV"

      # Every published build moves :latest and adds a dated :YYYYMMDD tag, so
      # the date tags are the way back to any earlier image.
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ env.DATE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
