# The probe: the agent plus the diagnostics kit. Copy this file, fill in the
# three values, and `docker compose up -d`.
services:
  meshcentral-agent:
    container_name: meshcentral-agent
    image: ghcr.io/wus-technik/docker-meshcentral-agent:stable
    restart: unless-stopped
    # This is the name the device carries on the MeshCentral server. Set it,
    # and then leave it alone: without it Docker invents a new random hostname
    # every time the container is recreated, and the agent's next connect
    # renames the device to match.
    hostname: meshagent-site01
    # Required. The agent derives its NodeID from the MAC address, and Docker
    # hands out a fresh one on every start — without this the device
    # re-registers after each restart and the old entry is orphaned. Scheme:
    # 02 (locally administered) : 57:53 ("WS") : site : instance. Must be
    # unique within the Docker network.
    mac_address: "02:57:53:03:01:01"
    volumes:
      - ./meshagent-data:/meshagent  # Keeps the agent installed across restarts
    # No extra capabilities needed: Docker's default NET_RAW already covers
    # ping, arping, nmap SYN scans and tcpdump in promiscuous mode (tested
    # 2026-10-28). NET_ADMIN only adds the power to CHANGE the network —
    # routes, addresses, interfaces, firewall — and with network_mode: host
    # that is the host's network, handed to anyone who controls the agent.
    # Add it only for a session that needs it, then take it out again.
    # cap_add:
    #   - NET_ADMIN
    # On the bridge, the probe sees the bridge. Uncomment to put it on the
    # host's own interfaces instead — that is what you want to look at the
    # site's VLANs. The host's own hostname and MAC then win over `hostname:`
    # and `mac_address:` above.
    # network_mode: host
    environment:
      MESH_SERVER_URL: "https://your-meshcentral-server.com"
      # Group IDs contain $ characters. Compose reads a single $ as variable
      # interpolation, so write every one of them twice: $$
      MESH_GROUP_ID: "your-super-long-group-id"
