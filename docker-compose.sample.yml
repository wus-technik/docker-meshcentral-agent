# The probe: the agent plus the diagnostics kit. Copy this file, fill in the
# two values, and `docker compose up -d`.
services:
  meshcentral-agent:
    container_name: meshcentral-agent
    image: ghcr.io/wus-technik/docker-meshcentral-agent:stable
    restart: unless-stopped
    volumes:
      - ./meshagent-data:/meshagent  # Keeps the agent installed across restarts
    # ping works without this (Docker grants NET_RAW by default); tcpdump needs
    # it to put an interface into promiscuous mode.
    cap_add:
      - NET_ADMIN
    # On the bridge, the probe sees the bridge. Uncomment to put it on the
    # host's own interfaces instead — that is what you want to look at the
    # site's VLANs, and it makes container_name and cap_add the only things
    # below that still apply.
    # network_mode: host
    environment:
      MESH_SERVER_URL: "https://your-meshcentral-server.com"
      # Group IDs contain $ characters. Compose reads a single $ as variable
      # interpolation, so write every one of them twice: $$
      MESH_GROUP_ID: "your-super-long-group-id"
